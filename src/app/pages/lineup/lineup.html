<div class="lineup-wrapper">

  <div class="toggle-wrapper">
    <app-toggle aria-label="Festival day" [value]="selectedDayId()" (valueChange)="selectDay($event)"/>
  </div>



    <section class="lineup-artists">
      <ul class="list">
        @for (artist of dayArtists(); track artist.billing) {
          <li>
            <button type="button" class="row"
            [class.active]="artist.id === active()?.id"
            [class.headliner]="artist.tier === 'headliner'"
            [attr.aria-current]="artist.id === active()?.id ? 'true' : 'false'"
            (click)="selectArtist(artist.id)">

              <span class="artist-name">{{ artist.name }}</span>
              <span class="artist-tier">{{ artist.tier }}</span>
              <span class="artist-time">{{ artist.time }}</span>

            </button>
          </li>

        } @empty {
            <li class="empty">Line Up Coming Soon</li>
          }
      </ul>



   @if(active(); as a) {
    <article class="details">
      <img [src]="a.photo" [alt]="a.photoAlt">
      <div class="artist-info">
        <h2 class="artist-name">{{ a.name }}</h2>

        <div class="artist-details">
          <p class="artist-tier">{{ a.tier }}</p>
          <p class="artist-genre">{{ a.genre }}</p>

        </div>

        <button type=button class="artist-link">Listen</button>

      </div>
    </article>


   }

  </section>
</div>
